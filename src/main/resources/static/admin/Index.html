<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bubu Admin</title>
    <link rel="stylesheet" href="css/Admin.css">
</head>
<body>
<div class="app" id="app">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <div class="brand-logo">B</div>
            <div>
                <div class="brand-name">Bubu</div>
                <div class="brand-sub">Trang quản trị</div>
            </div>
        </div>

        <nav class="menu">
            <div class="menu-label">Quản lý</div>
            <a href="#/products" class="menu-item" data-route="products">
                <svg viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5V8Z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg>
                <span>Quản lý sản phẩm</span>
            </a>
            <a href="#/categories" class="menu-item" data-route="categories">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
                <span>Quản lý danh mục</span>
            </a>
            <a href="#/orders" class="menu-item" data-route="orders">
                <svg viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4H6Z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/></svg>
                <span>Quản lý đơn hàng</span>
                <span class="menu-badge" id="pendingBadge">0</span>
            </a>
        </nav>

        <div class="sidebar-foot">
            <div class="avatar">AD</div>
            <div class="who">
                <div class="who-name">Admin</div>
                <div class="who-mail">admin@bubu.vn</div>
            </div>
        </div>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <!-- MAIN -->
    <div class="main">
        <header class="topbar">
            <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Mở menu">
                <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
            </button>
            <div>
                <h1 class="page-title" id="pageTitle">Quản lý sản phẩm</h1>
                <div class="crumb" id="pageCrumb">Trang chủ / Sản phẩm</div>
            </div>
            <div class="topbar-right">
                <button class="btn btn-primary" id="addBtn">
                    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                    <span id="addBtnText">Thêm sản phẩm</span>
                </button>
            </div>
        </header>

        <main class="content" id="content"></main>
    </div>
</div>

<!-- Modal dùng chung (thêm / sửa / xác nhận) -->
<div class="modal-wrap" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-head">
            <h3 id="modalTitle"></h3>
            <button class="icon-btn" data-close aria-label="Đóng"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-foot" id="modalFoot"></div>
    </div>
</div>

<!-- Drawer xem chi tiết -->
<div class="drawer-wrap" id="drawer" hidden>
    <div class="drawer">
        <div class="modal-head">
            <h3 id="drawerTitle">Chi tiết</h3>
            <button class="icon-btn" data-close aria-label="Đóng"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </div>
        <div class="drawer-body" id="drawerBody"></div>
        <div class="modal-foot" id="drawerFoot"></div>
    </div>
</div>

<div class="toast-box" id="toasts"></div>

<script src="js/app.js"></script>
</body>
</html>
